<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Duel Units 3-4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a single centered column, like a flashcard deck. Plum ink, hard offset shadows, one hot-pink and one teal player colour. */
:root{
  --bg:#fbe7f0; --surface:#ffffff; --ink:#2b1640; --muted:#6a5384;
  --p1:#c2255c; --on-p1:#ffffff; --p2:#0b7285; --on-p2:#ffffff;
  --sun:#ffd43b; --on-sun:#2b1640;
  --ok:#1b8f5a; --ok-soft:#d7f5e5; --bad:#cf3a34; --bad-soft:#ffe0de;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b0f2c; --surface:#2a1944; --ink:#f6ecff; --muted:#b9a4d6;
    --p1:#ff7aa8; --on-p1:#3a0a1f; --p2:#5fd3e6; --on-p2:#04222a;
    --ok:#4cd08f; --ok-soft:#17402f; --bad:#ff7a73; --bad-soft:#4a2325;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b0f2c; --surface:#2a1944; --ink:#f6ecff; --muted:#b9a4d6;
  --p1:#ff7aa8; --on-p1:#3a0a1f; --p2:#5fd3e6; --on-p2:#04222a;
  --ok:#4cd08f; --ok-soft:#17402f; --bad:#ff7a73; --bad-soft:#4a2325;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:17px;line-height:1.35;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
.btn{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.2;min-height:56px;padding:10px 16px;border:3px solid var(--ink);border-radius:16px;
  background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;text-wrap:balance}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{cursor:default}
.btn.primary{background:var(--sun);color:var(--on-sun)}
.btn.small{min-height:40px;font-size:.95rem;padding:6px 12px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.wide{width:100%}
:is(button,input):focus-visible{outline:4px solid var(--p2);outline-offset:2px}
.card{background:var(--surface);border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px}

/* setup */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,12vw,3.4rem);line-height:.95;letter-spacing:-.02em}
.hero h1 em{font-style:normal;display:inline-block;background:var(--p1);color:var(--on-p1);border:3px solid var(--ink);border-radius:12px;padding:2px 10px 4px;transform:rotate(-2deg)}
.hero p{color:var(--muted)}
.lbl{font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pcard{border:3px solid var(--ink);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.p0{background:color-mix(in srgb,var(--p1) 15%,var(--surface))}
.pcard.p1{background:color-mix(in srgb,var(--p2) 15%,var(--surface))}
.pcard input{width:100%;font:700 1.3rem var(--display);padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink)}
.lvls{display:flex;flex-direction:column;gap:8px}
.lv{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:52px;padding:6px 12px;border-radius:12px;font-size:1.05rem;box-shadow:0 3px 0 var(--ink)}
.lv small{font-family:var(--body);font-weight:700;font-size:.82rem;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.lv[aria-pressed="true"] small{color:var(--on-sun)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;font-size:1.02rem;padding:6px 14px;border-radius:12px;box-shadow:0 3px 0 var(--ink);text-align:left}
.chip small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.chip[aria-pressed="true"] small{color:var(--on-sun)}
.hint{font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* game */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{font-family:var(--display);font-weight:700;font-size:1.05rem}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{border:3px solid var(--ink);border-radius:16px;padding:8px 12px;background:var(--surface);box-shadow:0 3px 0 var(--ink);opacity:.72;transition:transform .15s;min-width:0}
.pc.on{opacity:1;transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}
.pc.p0.on{background:var(--p1);color:var(--on-p1)}
.pc.p1.on{background:var(--p2);color:var(--on-p2)}
.pn{font-family:var(--display);font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.ps.pop{animation:pop .4s}
.pm{font-size:.85rem}
@keyframes pop{40%{transform:scale(1.3)}}
.timer{height:18px;border:3px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.timer i{display:block;height:100%;background:var(--ok);transform-origin:left}
.timer i.low{background:var(--bad)}
.tag{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.2;text-wrap:balance}
.prompt small{font-family:var(--body);font-size:1rem;color:var(--muted);font-weight:700;display:block;margin-top:4px}
.bigword{display:block;font-size:2.5rem;font-weight:800;line-height:1.05;color:var(--p1);margin-top:6px;overflow-wrap:anywhere}
.lead{font-family:var(--display);font-weight:700;font-size:1.35rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(var(--cols,1),1fr);gap:12px}
.opt{display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;overflow-wrap:anywhere}
.opt.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--p1);margin:0 2px}
.pattern{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.2em;text-align:center;color:var(--muted);white-space:pre-wrap}
.txt{width:100%;font:700 1.6rem var(--display);text-align:center;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink)}
.txt.right{border-color:var(--ok);background:var(--ok-soft)}
.txt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot,.tile{width:42px;height:52px;border-radius:10px;display:grid;place-items:center;font:700 1.5rem var(--display);padding:0}
.slot{border:3px dashed var(--muted);background:var(--bg);cursor:pointer;color:var(--ink)}
.slot.filled{border:3px solid var(--ink);background:var(--sun);color:var(--on-sun)}
.tile{border:3px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tile.used{visibility:hidden}
.fb{border:3px solid;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-family:var(--display);font-weight:800;font-size:1.5rem}
.fb .ans{font-size:1.1rem}
.fiche{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.fiche b{font-family:var(--display);font-size:1.25rem}
.fiche i{display:block;font-style:normal;color:var(--muted)}

/* end */
.win{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.win h2{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.05}
.final{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.final .pc{opacity:1;text-align:center}
.final .pc.win1{transform:translateY(-3px) scale(1.03)}
.final .pc.p0{background:var(--p1);color:var(--on-p1)}
.final .pc.p1{background:var(--p2);color:var(--on-p2)}
.rev{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:44px;font-size:1rem;padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.rev small{font-family:var(--body);font-size:.82rem;color:var(--muted)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function speakFallback(text){
 if(!SYN)return;
 try{speechSynthesis.cancel();setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'en-GB';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}},70)}catch(e){}
}
function sayKeys(keys){const ks=keys.map(k=>String(k).toLowerCase());if(HAS&&ks.every(k=>AUD[k]))playKeys(ks);else speakFallback(keys.join('. '))}
const sayWord=w=>{const v=W.find(x=>x.w===w);if(v)sayKeys([v.w,v.ex])};
function tone(f,d,t0,type,vol){
 if(S.muted)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={
 ok(){[523,659,784].forEach((f,i)=>tone(f,.18,i*.09,'triangle'))},
 bad(){tone(220,.28,0,'sawtooth',.09);tone(165,.32,.12,'sawtooth',.09)},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,i*.12,'triangle'))}
};

/* ---------- questions ---------- */
const cur=()=>S.players[S.t%2];
const pool=()=>{const p=W.filter(v=>S.units.has(v.u));return p.length>=4?p:W};
function others(v,n,o){
 o=o||{};
 let c=pool().filter(x=>x!==v);
 if(o.avoid)c=c.filter(x=>x.g!==v.g&&!v.x.includes(x.w));
 if(o.noOpp)c=c.filter(x=>x.w!==v.opp);
 if(c.length<n)c=W.filter(x=>x!==v&&!(o.avoid&&(x.g===v.g||v.x.includes(x.w))));
 let out=[];
 if(o.opp&&v.opp){const ov=W.find(x=>x.w===v.opp);if(ov&&ov!==v)out.push(ov)}
 shuffle(c).forEach(x=>{if(out.length<n&&!out.includes(x))out.push(x)});
 return out.slice(0,n);
}
const tagU=(v,t)=>'Unit '+v.u+' · '+t;
const fiche=v=>'<div class="fiche"><b>'+esc(v.w)+'</b> = '+esc(v.es)+'<i>'+esc(v.ex)+'</i><i>'+esc(v.exEs)+'</i></div>';
const blankHTML=ctx=>esc(ctx).replace('____','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
const base=(v,o)=>Object.assign({kind:'choice',cols:1,tag:tagU(v,'Vocabulary'),ans:v.w,fiche:fiche(v),keys:[v.w,v.ex],rev:{w:v.w,small:v.es}},o);
const variants=s=>{const a=[norm(s)];const c=s.replace(/\b(it|he|she|that) is\b/i,'$1\'s').replace(/\bI am\b/,"I'm");if(norm(c)!==a[0])a.push(norm(c));return a};
const patternOf=w=>[...w].map(()=>'_').join(' ');

function qEn2Es(v,n,tricky){
 const d=others(v,n-1,{opp:tricky,noOpp:!tricky});
 return base(v,{key:'e2s'+v.w,tag:tagU(v,'Significado'),promptHTML:'¿Qué significa?<span class="bigword">'+esc(v.w)+'</span>',listen:v.w,ans:v.es,
  opts:shuffle([v,...d]).map(x=>({h:esc(x.es),ok:x===v}))});
}
function qEs2En(v,n,tricky){
 const d=others(v,n-1,{opp:tricky,noOpp:!tricky});
 return base(v,{key:'s2e'+v.w,tag:tagU(v,'En inglés'),promptHTML:'¿Cómo se dice en inglés?<span class="bigword">'+esc(v.es)+'</span>',cols:2,
  opts:shuffle([v,...d]).map(x=>({h:esc(x.w),ok:x===v}))});
}
function qListen(v,n){
 return base(v,{key:'lis'+v.w,tag:tagU(v,'Listening'),promptHTML:'Listen and choose the word',listen:v.w,auto:true,cols:2,
  opts:shuffle([v,...others(v,n-1)]).map(x=>({h:esc(x.w),ok:x===v}))});
}
function qCloze(v,n,hint){
 return base(v,{key:'clz'+v.w,tag:tagU(v,'Complete the sentence'),promptHTML:blankHTML(v.ctx)+(hint?'<small>Pista: '+esc(v.es)+'</small>':''),cols:2,
  opts:shuffle([v,...others(v,n-1,{avoid:true})]).map(x=>({h:esc(x.w),ok:x===v}))});
}
function qOpp(v,n){
 const ov=W.find(x=>x.w===v.opp);
 const d=others(v,n-1,{avoid:true,noOpp:true}).filter(x=>x!==ov).slice(0,n-1);
 return base(v,{key:'opp'+v.w,tag:tagU(v,'Opposites'),promptHTML:'What is the opposite of<span class="bigword">'+esc(v.w)+'</span>',ans:ov.w,fiche:fiche(ov),keys:[ov.w,ov.ex],cols:2,rev:{w:ov.w,small:ov.es},
  opts:shuffle([ov,...d]).map(x=>({h:esc(x.w),ok:x===ov}))});
}
function typed(v,o){return base(v,Object.assign({kind:'type',answers:[norm(v.w)],pattern:patternOf(v.w)},o))}
function qTypeEs2En(v){return typed(v,{key:'tse'+v.w,tag:tagU(v,'Spelling'),promptHTML:'Escribe en inglés<span class="bigword">'+esc(v.es)+'</span>'})}
function qDictWord(v){return typed(v,{key:'dcw'+v.w,tag:tagU(v,'Dictation'),promptHTML:'Listen and write the word',listen:v.w,auto:true})}
function qClozeType(v){return typed(v,{key:'czt'+v.w,tag:tagU(v,'Complete the sentence'),promptHTML:blankHTML(v.ctx),pattern:v.w[0]+' '+[...v.w.slice(1)].map(()=>'_').join(' ')})}
function qTranslate(v){return typed(v,{key:'tr'+v.w,tag:tagU(v,'Translate'),promptHTML:'Escribe en inglés<span class="bigword" style="font-size:1.7rem">'+esc(v.exEs)+'</span>',answers:variants(v.ex),pattern:'',lead:'',ans:v.ex,timeMult:3,
  rev:{w:v.w,small:v.es}})}
function qDictSentence(v){return typed(v,{key:'dcs'+v.w,tag:tagU(v,'Dictation'),promptHTML:'Listen and write the whole sentence',listen:v.ex,auto:true,answers:variants(v.ex),pattern:'',ans:v.ex,timeMult:3})}
function qOppType(v){const ov=W.find(x=>x.w===v.opp);return base(v,{kind:'type',key:'opt'+v.w,tag:tagU(v,'Opposites'),promptHTML:'Write the opposite of<span class="bigword">'+esc(v.w)+'</span>',answers:[norm(ov.w)],pattern:patternOf(ov.w),ans:ov.w,fiche:fiche(ov),keys:[ov.w,ov.ex],rev:{w:ov.w,small:ov.es}})}
function qScramble(v){
 const t=norm(v.w);let l=shuffle([...t]);for(let k=0;k<8&&l.join('')===t;k++)l=shuffle(l);
 return base(v,{kind:'scramble',key:'scr'+v.w,tag:tagU(v,'Unscramble'),promptHTML:'Ordena las letras<span class="bigword" style="font-size:1.8rem">'+esc(v.es)+'</span>',letters:l,target:t});
}
function genQ(lv){
 const v=pick(pool());
 const g={
  easy:[()=>qEn2Es(v,3),()=>qEs2En(v,3),()=>qListen(v,3),()=>qCloze(v,3,true)],
  medium:[()=>qEn2Es(v,4,true),()=>qEs2En(v,4,true),()=>qListen(v,4),()=>qCloze(v,4)].concat(v.opp?[()=>qOpp(v,4),()=>qOpp(v,4)]:[]),
  hard:[()=>qTypeEs2En(v),()=>qDictWord(v),()=>qClozeType(v),()=>qTranslate(v),()=>qDictSentence(v),()=>qScramble(v)].concat(v.opp?[()=>qOppType(v)]:[])
 }[lv];
 return pick(g)();
}
function makeQ(lv){
 let q;for(let i=0;i<40;i++){q=genQ(lv);if(!S.seen.has(q.key))break}
 S.seen.add(q.key);return q;
}

/* ---------- setup screen ---------- */
function showSetup(){
 stopAudio();clearInterval(S.ti);
 app.innerHTML=
 '<header class="hero"><h1>Word <em>Duel</em></h1><p>Quiz por turnos con puntos para las Units 3 y 4. Cada jugador elige su nivel, así podéis retaros aunque uno juegue en difícil.</p></header>'+
 '<section class="card">'+
  '<div class="lbl">Jugadores</div><div class="players">'+[0,1].map(i=>
   '<div class="pcard p'+i+'"><label class="lbl" for="name'+i+'">Jugador '+(i+1)+'</label>'+
   '<input id="name'+i+'" maxlength="14" autocomplete="off" value="'+esc(S.names[i])+'">'+
   '<div class="lvls">'+Object.keys(LVL).map(k=>'<button type="button" class="btn lv" data-p="'+i+'" data-l="'+k+'" aria-pressed="false">'+'★'.repeat(LVL[k].stars)+' '+LVL[k].name+'<small>'+LVL[k].desc+'</small></button>').join('')+'</div></div>').join('')+'</div>'+
  '<div><div class="lbl">Unidades</div><div class="chips" style="margin-top:8px">'+UNITS.map(u=>'<button type="button" class="btn chip" data-u="'+u[0]+'" aria-pressed="false">'+u[1]+'<small>'+u[2]+'</small></button>').join('')+'</div></div>'+
  '<div><div class="lbl">Preguntas por jugador</div><div class="chips" style="margin-top:8px">'+[5,8,12].map(n=>'<button type="button" class="btn chip" data-r="'+n+'" aria-pressed="false">'+n+'</button>').join('')+'</div></div>'+
  '<button type="button" class="btn primary wide" id="go" style="font-size:1.5rem;min-height:64px">¡Jugar!</button>'+
  '<div class="row"><button type="button" class="btn small" id="test">Probar voz en inglés</button><span class="hint">Algunas preguntas se escuchan. Sube el volumen y quita el modo silencio del móvil.</span></div>'+
 '</section>';
 syncSetup();
}
function syncSetup(){
 app.querySelectorAll('.lv').forEach(b=>b.setAttribute('aria-pressed',S.levels[+b.dataset.p]===b.dataset.l));
 app.querySelectorAll('[data-u]').forEach(b=>b.setAttribute('aria-pressed',S.units.has(+b.dataset.u)));
 app.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',S.rounds===+b.dataset.r));
 const go=$('#go');if(go){go.disabled=!S.units.size;go.style.opacity=S.units.size?1:.5}
}

/* ---------- game ---------- */
function startGame(){
 stopAudio();clearInterval(S.ti);
 S.names=[0,1].map(i=>(($('#name'+i)||{}).value||'').trim()||(i?'Mayor':'Ella'));
 save();
 S.players=[0,1].map(i=>({name:S.names[i],level:S.levels[i],score:0,streak:0,right:0,miss:[]}));
 S.t=0;S.seen=new Set();nextTurn();
}
function nextTurn(){
 if(S.t>=S.rounds*2)return showEnd();
 S.q=makeQ(cur().level);S.locked=false;S.slots=[];
 const lv=LVL[cur().level];
 S.limit=lv.time?Math.round(lv.time*(S.q.timeMult||(S.q.kind==='choice'?1:2))):0;
 showGame();
}
function sbHTML(){
 return '<div class="score">'+S.players.map((p,i)=>'<div class="pc p'+i+(S.t%2===i?' on':'')+'"><div class="pn">'+esc(p.name)+'</div><div class="ps" id="sc'+i+'">'+p.score+'</div><div class="pm">'+'★'.repeat(LVL[p.level].stars)+(p.streak>=2?' 🔥'+p.streak:'')+'</div></div>').join('')+'</div>';
}
function qBody(q){
 const lis=q.listen?'<div style="margin-top:8px"><button type="button" class="btn small say" data-say="'+esc(q.listen)+'">🔊 Escuchar</button></div>':'';
 let h='<div class="tag">'+esc(q.tag)+' · turno de '+esc(cur().name)+'</div><h2 class="prompt">'+q.promptHTML+lis+'</h2>';
 if(q.kind==='choice'){
  h+='<div class="grid" style="--cols:'+(q.cols||1)+'">'+q.opts.map((o,i)=>'<button type="button" class="btn opt" data-i="'+i+'">'+o.h+'</button>').join('')+'</div>';
 }else if(q.kind==='type'){
  if(q.pattern)h+='<div class="pattern">'+esc(q.pattern)+'</div>';
  h+='<form id="tf" style="display:flex;flex-direction:column;gap:10px"><input id="ans" class="txt" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Tu respuesta"><button class="btn primary" type="submit">Comprobar</button></form>';
 }else{
  h+='<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><button type="button" class="btn small" id="clear" style="align-self:center">Borrar</button>';
 }
 return h;
}
function drawScr(){
 const q=S.q,n=q.target.length,items=[];
 for(let i=0;i<n;i++){
  const si=S.slots[i];
  items.push('<button type="button" class="slot'+(si!==undefined?' filled':'')+'" data-pos="'+i+'" aria-label="Casilla '+(i+1)+'">'+(si!==undefined?q.letters[si]:'')+'</button>');
 }
 $('#slots').innerHTML=items.join('');
 $('#tiles').innerHTML=q.letters.map((c,i)=>'<button type="button" class="tile'+(S.slots.includes(i)?' used':'')+'" data-t="'+i+'" aria-label="Letra '+c+'">'+c+'</button>').join('');
}
function showGame(){
 const q=S.q;
 app.innerHTML=
 '<div class="top"><button type="button" class="btn small" id="quit">Salir</button><div class="prog">Pregunta '+(Math.floor(S.t/2)+1)+' de '+S.rounds+'</div><button type="button" class="btn small" id="fx">Efectos: '+(S.muted?'no':'sí')+'</button></div>'+
 '<div id="sb">'+sbHTML()+'</div>'+
 '<div class="timer"'+(S.limit?'':' hidden')+'><i id="tbar"></i></div>'+
 '<div class="card" id="qcard">'+qBody(q)+'</div><div id="fb"></div>';
 window.scrollTo(0,0);
 if(q.kind==='scramble')drawScr();
 if(q.auto)setTimeout(()=>{if(S.q===q&&!S.locked)sayKeys([q.listen])},300);
 if(S.limit)startTimer(S.limit);
 const inp=$('#ans');if(inp)setTimeout(()=>inp.focus({preventScroll:true}),120);
}
function startTimer(sec){
 S.tEnd=performance.now()+sec*1000;const tot=sec*1000,bar=$('#tbar');clearInterval(S.ti);
 S.ti=setInterval(()=>{
  const left=S.tEnd-performance.now(),f=Math.max(0,left/tot);
  if(bar){bar.style.transform='scaleX('+f+')';bar.classList.toggle('low',f<.25)}
  if(left<=0){clearInterval(S.ti);resolve(false,null,true)}
 },80);
}
function resolve(ok,idx,timedOut){
 if(S.locked)return;S.locked=true;clearInterval(S.ti);
 const q=S.q,p=cur(),pi=S.t%2,lv=LVL[p.level];let pts=0,streakBonus=false;
 if(ok){
  p.streak++;p.right++;
  const frac=S.limit?Math.max(0,(S.tEnd-performance.now())/(S.limit*1000)):0;
  pts=lv.base+Math.round(frac*lv.bonus);
  if(p.streak>=3){pts+=5;streakBonus=true}
  p.score+=pts;
 }else{
  p.streak=0;if(q.rev&&!p.miss.some(m=>m.w===q.rev.w))p.miss.push(q.rev);
 }
 if(q.kind==='choice'){
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('right');else if(i===idx)b.classList.add('wrong')});
 }else if(q.kind==='type'){
  const a=$('#ans');if(a){a.disabled=true;a.classList.add(ok?'right':'wrong')}
  const f=$('#tf button');if(f)f.disabled=true;
 }else{
  document.querySelectorAll('.tile,.slot').forEach(b=>b.disabled=true);
 }
 $('#sb').innerHTML=sbHTML();const sc=$('#sc'+pi);if(sc&&ok)sc.classList.add('pop');
 ok?sfx.ok():sfx.bad();
 const last=S.t+1>=S.rounds*2;
 $('#fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'" role="status">'+
  '<h3>'+(ok?'¡Correcto! +'+pts:(timedOut?'¡Se acabó el tiempo!':'¡Casi!'))+'</h3>'+
  (streakBonus?'<div>🔥 Racha de '+p.streak+', ¡+5 extra!</div>':'')+
  (ok?'':'<div class="ans">Respuesta: <b>'+esc(q.ans)+'</b></div>')+
  q.fiche+
  '<div class="row"><button type="button" class="btn small sw" data-sw="'+esc(q.keys[0])+'">🔊 Escuchar palabra y frase</button></div>'+
  '<button type="button" class="btn primary wide" id="next">'+(last?'Ver resultado':'Siguiente')+'</button></div>';
 $('#next').scrollIntoView({block:'nearest',behavior:'smooth'});
 setTimeout(()=>sayKeys(q.keys),450);
}

/* ---------- end ---------- */
function showEnd(){
 stopAudio();
 const [a,b]=S.players;let head,w=-1;
 if(a.score===b.score)head='¡Empate!';else{w=a.score>b.score?0:1;head='¡Gana '+esc(S.players[w].name)+'!'}
 const seen=new Set(),rev=[];S.players.forEach(p=>p.miss.forEach(m=>{if(!seen.has(m.w)){seen.add(m.w);rev.push(m)}}));
 app.innerHTML=
 '<section class="card"><div class="win"><div class="lbl">Fin del duelo</div><h2>'+head+'</h2>'+
 '<div class="final">'+S.players.map((p,i)=>'<div class="pc p'+i+(w===i?' win1':'')+'"><div class="pn">'+esc(p.name)+'</div><div class="ps">'+p.score+'</div><div class="pm">'+p.right+' de '+S.rounds+' bien · '+'★'.repeat(LVL[p.level].stars)+'</div></div>').join('')+'</div></div></section>'+
 (rev.length?'<section class="card"><div class="lbl">Para repasar juntos</div><div class="chips">'+rev.map(m=>'<button type="button" class="btn rev sw" data-sw="'+esc(m.w)+'">'+esc(m.w)+'<small>'+esc(m.small)+'</small></button>').join('')+'</div><div class="hint">Toca para escuchar la palabra y su frase.</div></section>':'<section class="card"><div class="prompt">¡Sin ningún fallo! Podéis subir el nivel.</div></section>')+
 '<div class="row"><button type="button" class="btn primary" id="again" style="flex:1">Revancha</button><button type="button" class="btn" id="settings" style="flex:1">Ajustes</button></div>';
 window.scrollTo(0,0);
 sfx.win();confetti();
}
function confetti(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#ffd43b','#c2255c','#0b7285','#1b8f5a','#a855f7','#ffffff'];
 const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
 const t0=performance.now();
 (function f(){
  const el=performance.now()-t0;x.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
  if(el<4200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
 })();
}

/* ---------- events ---------- */
let quitArm=0;
app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.say){sayKeys([t.dataset.say]);return}
 if(t.dataset.sw){sayWord(t.dataset.sw);return}
 if(t.classList.contains('lv')){S.levels[+t.dataset.p]=t.dataset.l;save();syncSetup();return}
 if(t.dataset.u){const u=+t.dataset.u;S.units.has(u)?S.units.delete(u):S.units.add(u);save();syncSetup();return}
 if(t.dataset.r){S.rounds=+t.dataset.r;save();syncSetup();return}
 switch(t.id){
  case 'go':if(S.units.size)startGame();return;
  case 'test':sayKeys(['hello! are you ready?']);return;
  case 'again':startGame();return;
  case 'settings':showSetup();return;
  case 'next':S.t++;nextTurn();return;
  case 'fx':S.muted=!S.muted;t.textContent='Efectos: '+(S.muted?'no':'sí');return;
  case 'quit':
   if(quitArm){quitArm=0;showSetup()}else{quitArm=1;t.textContent='¿Seguro?';setTimeout(()=>{quitArm=0;if(t.isConnected)t.textContent='Salir'},2500)}
   return;
  case 'clear':if(!S.locked){S.slots=[];drawScr()}return;
 }
 if(S.locked||!S.q)return;
 if(t.classList.contains('opt')){const i=+t.dataset.i;resolve(!!S.q.opts[i].ok,i)}
 else if(t.classList.contains('tile')){
  const i=+t.dataset.t,q=S.q;if(S.slots.includes(i)||S.slots.length>=q.target.length)return;
  S.slots.push(i);drawScr();
  if(S.slots.length===q.target.length)resolve(S.slots.map(k=>q.letters[k]).join('')===q.target);
 }else if(t.classList.contains('slot')&&t.classList.contains('filled')){S.slots.splice(+t.dataset.pos,1);drawScr()}
});
app.addEventListener('input',e=>{
 const m=/^name(\d)$/.exec(e.target.id||'');if(m){S.names[+m[1]]=e.target.value}
});
app.addEventListener('submit',e=>{
 e.preventDefault();if(S.locked||!S.q||S.q.kind!=='type')return;
 const v=norm($('#ans').value);if(!v)return;
 resolve(S.q.answers.includes(v));
});

showSetup();
})();
</script>
